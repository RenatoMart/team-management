services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: team_management
      POSTGRES_PASSWORD: team_management
      POSTGRES_DB: team_management
    ports:
      - "5433:5432"
    volumes:
      - team_management_db:/var/lib/postgresql/data

volumes:
  team_management_db:
